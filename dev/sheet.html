<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#ddd;font:12px system-ui}canvas{display:block}.row{display:flex;gap:8px;padding:8px;align-items:flex-start}</style>
<div class="row" id="out"></div>
<script type="module">
import { setLook, surface } from '../js/riso.js';
import { bakeBalloon, bakeGround, ballSprite, crowd, person, flame } from '../js/scene.js';
const q = new URLSearchParams(location.search), out = document.getElementById('out');
const looks = (q.get('looks') || 'picnic,rotary,fluoro').split(','), W = +(q.get('w') || 390), H = +(q.get('h') || 520), dpr = +(q.get('dpr') || 2);
for (const lk of looks) {
  setLook(lk);
  const s = surface(W, H, dpr); s.cv.style.width = W + 'px'; s.cv.style.height = H + 'px';
  const hy = H * 0.52, L = { w: W, h: H, hy, x: [W * 0.6, H * 0.8], xs: Math.min(60, W * 0.08), tape: [[W * 0.02, H * 0.7], [W * 0.14, H * 0.69], [W * 0.28, H * 0.68], [W * 0.42, H * 0.675], [W * 0.56, H * 0.67]] };
  const g = bakeGround(s, L);
  const B = bakeBalloon(Math.min(240, W * 0.5), dpr);
  s.ctx.drawImage(B.cv, W * 0.6 - B.w / 2, H * 0.06, B.w, B.h);
  flame(s.ctx, W * 0.6 - B.w / 2 + B.mouth[0], H * 0.06 + B.mouth[1], B.S * 0.08, 0.6, 1.3);
  const cr = crowd(5, W * 0.04, W * 0.4, () => H * 0.74, Math.min(60, H * 0.1));
  cr.forEach((p) => person(s.ctx, p, 0));
  for (let i = 0; i < 40; i++) { const r = 2 + (i % 5); const b = ballSprite(r, dpr); s.ctx.drawImage(b.cv, W * 0.45 + (i * 37) % (W * 0.4), H * 0.76 + (i * 13) % (H * 0.2), b.size, b.size); }
  const lab = document.createElement('div'); lab.append(lk, s.cv); out.append(lab);
}
document.title = 'ready';
</script>
