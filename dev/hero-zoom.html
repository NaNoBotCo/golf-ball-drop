<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#ddd}canvas{display:block}</style>
<div id="out"></div>
<script type="module">
import { setLook, surface } from '../js/riso.js';
import { bakeBalloon, bakeGround, ballSprite, crowd, person, flame, bakeCloud } from '../js/scene.js';
const q = new URLSearchParams(location.search), out = document.getElementById('out');
const what = q.get('what') || 'balloon', lk = q.get('look') || 'picnic', dpr = +(q.get('dpr') || 2), S = +(q.get('S') || 380);
setLook(lk);
if (what === 'balloon') {
  const B = bakeBalloon(S, dpr, 11), cv = document.createElement('canvas'), c = cv.getContext('2d'); cv.width = B.w * dpr; cv.height = (B.h) * dpr; cv.style.width = B.w + 'px'; cv.style.height = B.h + 'px';
  c.fillStyle = q.get('bg') || '#7fb4d6'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(B.cv, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0); flame(c, B.mouth[0], B.mouth[1], B.S * 0.07, +(q.get('k') || 0.25), 1.3);
  out.append(cv);
}
if (what === 'crowd') {
  const sc = +(q.get('sc') || 4), h = 60, W = 460, H = 130, s = surface(W, H, dpr); s.ctx.fillStyle = '#c9d84a'; s.ctx.fillRect(0, 0, W, H);
  const cr = crowd(+(q.get('seed') || 5), 10, W - 10, () => H - 18, h);
  cr.forEach((p) => person(s.ctx, p, 0));
  s.cv.style.width = W * sc + 'px'; s.cv.style.height = H * sc + 'px'; out.append(s.cv);
}
if (what === 'archs') {
  const sc = +(q.get('sc') || 4), h = +(q.get('h') || 60), W = 8 * 44, H = 100, s = surface(W, H, dpr); s.ctx.fillStyle = '#c9d84a'; s.ctx.fillRect(0, 0, W, H);
  for (let a = 0; a < 8; a++) { const p = { x: 22 + a * 44, base: H - 16, h: a === 4 ? h * 0.62 : h, arch: a, flip: false, hop: -1, ph: 0, seed: 100 + a, hairV: a % 3, skinV: a % 3, alt: +(q.get('alt') || 0) === 1, build: 1 }; person(s.ctx, p, 0); if (q.get('pose')) { p.phoneUntil = 1e9; person(s.ctx, p, 1); } }
  s.cv.style.width = W * sc + 'px'; s.cv.style.height = H * sc + 'px'; out.append(s.cv);
}
if (what === 'ground') {
  const W = +(q.get('w') || 390), H = +(q.get('h') || 460), s = surface(W, H, dpr), hy = Math.round(H * 0.58), wide = W >= 900;
  const L = { w: W, h: H, hy, x: [W * (wide ? 0.72 : 0.6), hy + (H - hy) * 0.38], xs: Math.max(26, (wide ? 296 : 166) * 0.2), tape: [], tapeW: wide ? 4 : 3, pitch: wide ? 5.6 : 4.8, reg: wide ? 1.2 : 0.9, chedis: wide ? [0.48, 0.52, 0.9] : [0.12, 0.17, 0.88], clouds: [], kapok: q.get('kapok') || (wide ? 'right' : 'left'), liveTape: true };
  const yT = hy + (H - hy) * 0.6; for (let x = wide ? W * 0.44 : -10; x <= W + 10; x += wide ? 70 : 52) L.tape.push([x, yT + Math.sin(x * 0.01) * 3]);
  const t0 = performance.now(); bakeGround(s, L, 3); document.title = 'bake ' + Math.round(performance.now() - t0) + 'ms';
  const sc = +(q.get('sc') || 1); s.cv.style.width = W * sc + 'px'; s.cv.style.height = H * sc + 'px'; out.append(s.cv);
}
if (what === 'ball') {
  const sc = 8, s = surface(260, 40, dpr); s.ctx.fillStyle = '#9ab83a'; s.ctx.fillRect(0, 0, 260, 40);
  [2.2, 2.6, 3.2, 3.6, 4.4, 5.5, 6.5, 8].forEach((r, i) => { const b = ballSprite(r, dpr); s.ctx.drawImage(b.cv, 10 + i * 30, 20 - b.size / 2, b.size, b.size); });
  s.cv.style.width = 260 * sc / 2 + 'px'; out.append(s.cv);
}
if (what === 'cloud') {
  const s = surface(500, 120, dpr); s.ctx.fillStyle = '#9fc7e0'; s.ctx.fillRect(0, 0, 500, 120);
  [[60, 1], [90, 2], [120, 3]].forEach(([rx, sd], i) => { const cl = bakeCloud(rx, sd, dpr); s.ctx.drawImage(cl.cv, i * 160, 0, cl.w, cl.h); });
  out.append(s.cv); s.cv.style.width = '500px';
}
document.fonts.ready.then(() => { window.__ready = true; });
</script>
